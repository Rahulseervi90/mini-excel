<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#217346" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mini Excel" />
    <title>Mini Excel</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="titlebar"><span>Mini Excel</span><button class="btn" id="btn-install" hidden title="Install Mini Excel as an app on this device">Install app</button></div>

    <div id="toolbar">
      <div class="group">
        <button class="btn" id="btn-new" title="Start a new empty sheet">New</button>
        <button class="btn" id="btn-open" title="Open a .json or .csv file (Ctrl+O)">Open</button>
        <button class="btn" id="btn-save" title="Save as .json - keeps formulas and formatting (Ctrl+S)">Save</button>
        <button class="btn" id="btn-csv" title="Export the shown values as .csv">Export CSV</button>
      </div>
      <div class="group">
        <button class="btn" id="btn-undo" title="Undo the last change (Ctrl+Z)">Undo</button>
        <button class="btn" id="btn-redo" title="Redo (Ctrl+Y)">Redo</button>
      </div>
      <div class="group">
        <button class="btn" id="btn-cut" title="Cut the selected cells (Ctrl+X)">Cut</button>
        <button class="btn" id="btn-copy" title="Copy the selected cells (Ctrl+C)">Copy</button>
        <button class="btn" id="btn-paste" title="Paste at the selected cell (Ctrl+V)">Paste</button>
      </div>
      <div class="group">
        <button class="btn" id="btn-bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button class="btn" id="btn-italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <label class="fill" title="Fill color of the selected cell">
          Fill <input type="color" id="fill-color" value="#ffff99" />
        </label>
        <button class="btn" id="btn-nofill" title="Remove the fill color">No fill</button>
        <select class="btn" id="num-format" title="How numbers look in the selected cells">
          <option value="general">General</option>
          <option value="number">Number 1,234.50</option>
          <option value="currency">Rupees ₹1,234.50</option>
          <option value="percent">Percent 12.5%</option>
          <option value="date">Date 22-Nov-2026</option>
          <option value="datetime">Date and time</option>
        </select>
      </div>
      <div class="group">
        <button class="btn" id="btn-insrow" title="Insert row(s) above the selection">+ Row</button>
        <button class="btn" id="btn-delrow" title="Delete the selected row(s)">- Row</button>
        <button class="btn" id="btn-inscol" title="Insert column(s) left of the selection">+ Col</button>
        <button class="btn" id="btn-delcol" title="Delete the selected column(s)">- Col</button>
      </div>
      <div class="group">
        <button class="btn" id="btn-sortasc" title="Sort the table by the selected column, smallest first">Sort A-Z</button>
        <button class="btn" id="btn-sortdesc" title="Sort the table by the selected column, largest first">Sort Z-A</button>
        <label class="chk" title="Tick this if the first row holds titles: sort and filter will leave it alone">
          <input type="checkbox" id="chk-header" /> Header row
        </label>
      </div>
      <div class="group">
        <input class="filter" id="filter-text" type="text" spellcheck="false" placeholder="Filter: text or >5" title="Show only rows where the selected column contains this text, or a number test like >5, <=10, =3" />
        <button class="btn" id="btn-filter" title="Hide the rows that do not match">Filter</button>
        <button class="btn" id="btn-showall" title="Show every row again">Show all</button>
      </div>
      <div class="group">
        <button class="btn" id="btn-chart" title="Make a chart from the selected cells">Chart</button>
      </div>
      <div class="group">
        <button class="btn" id="btn-filldown" title="Fill the selected cells down from the top one (Ctrl+D)">Fill down</button>
        <button class="btn" id="btn-fillright" title="Fill the selected cells to the right from the left one (Ctrl+R)">Fill right</button>
      </div>
    </div>

    <div id="formula-row">
      <input id="name-box" type="text" spellcheck="false" title="Type a cell name like C5 and press Enter" />
      <span class="fx">fx</span>
      <input id="formula-bar" type="text" spellcheck="false" title="Edit the selected cell here" />
    </div>

    <div id="grid-wrap" tabindex="0">
      <table id="grid"></table>
    </div>

    <div id="statusbar">
      <span id="status">Ready</span>
      <span id="summary"></span>
    </div>

    <div id="chart-modal" hidden>
      <div class="chart-box" role="dialog" aria-label="Chart">
        <div class="chart-bar">
          <select id="chart-type" class="btn" title="Chart type">
            <option value="column">Column chart</option>
            <option value="line">Line chart</option>
            <option value="pie">Pie chart</option>
          </select>
          <select id="chart-labels" class="btn" title="Is the first column a list of names?">
            <option value="auto">First column: auto</option>
            <option value="first">First column = names</option>
            <option value="none">First column = numbers</option>
          </select>
          <input id="chart-title" class="filter" type="text" placeholder="Chart title" spellcheck="false" />
          <button class="btn" id="chart-save" title="Save the chart as a picture">Save picture</button>
          <button class="btn" id="chart-close" title="Close (Esc)">Close</button>
        </div>
        <div id="chart-source"></div>
        <div id="chart-body"></div>
      </div>
    </div>

    <input type="file" id="file-input" accept=".json,.csv,text/csv,application/json" hidden />

    <script src="src/engine.js"></script>
    <script src="src/csv.js"></script>
    <script src="src/chart.js"></script>
    <script src="src/grid.js"></script>
    <script src="src/pwa.js"></script>
  </body>
</html>
