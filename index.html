<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#217346" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mini Excel" />
    <title>Mini Excel</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="titlebar"><span>Mini Excel</span><button class="btn" id="btn-install" hidden title="Install Mini Excel as an app on this device">Install app</button></div>

    <div id="toolbar">
      <div class="group">
        <button class="btn" id="btn-new" title="Start a new empty sheet">New</button>
        <button class="btn" id="btn-open" title="Open a .json or .csv file (Ctrl+O)">Open</button>
        <button class="btn" id="btn-save" title="Save as .json - keeps formulas and formatting (Ctrl+S)">Save</button>
        <button class="btn" id="btn-csv" title="Export the shown values as .csv">Export CSV</button>
      </div>
      <div class="group">
        <button class="btn" id="btn-undo" title="Undo the last change (Ctrl+Z)">Undo</button>
        <button class="btn" id="btn-redo" title="Redo (Ctrl+Y)">Redo</button>
      </div>
      <div class="group">
        <button class="btn" id="btn-cut" title="Cut the selected cells (Ctrl+X)">Cut</button>
        <button class="btn" id="btn-copy" title="Copy the selected cells (Ctrl+C)">Copy</button>
        <button class="btn" id="btn-paste" title="Paste at the selected cell (Ctrl+V)">Paste</button>
      </div>
      <div class="group">
        <button class="btn" id="btn-bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button class="btn" id="btn-italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <label class="fill" title="Fill color of the selected cell">
          Fill <input type="color" id="fill-color" value="#ffff99" />
        </label>
        <button class="btn" id="btn-nofill" title="Remove the fill color">No fill</button>
      </div>
      <div class="group">
        <button class="btn" id="btn-filldown" title="Fill the selected cells down from the top one (Ctrl+D)">Fill down</button>
        <button class="btn" id="btn-fillright" title="Fill the selected cells to the right from the left one (Ctrl+R)">Fill right</button>
      </div>
    </div>

    <div id="formula-row">
      <input id="name-box" type="text" spellcheck="false" title="Type a cell name like C5 and press Enter" />
      <span class="fx">fx</span>
      <input id="formula-bar" type="text" spellcheck="false" title="Edit the selected cell here" />
    </div>

    <div id="grid-wrap" tabindex="0">
      <table id="grid"></table>
    </div>

    <div id="statusbar">
      <span id="status">Ready</span>
      <span id="summary"></span>
    </div>

    <input type="file" id="file-input" accept=".json,.csv,text/csv,application/json" hidden />

    <script src="src/engine.js"></script>
    <script src="src/csv.js"></script>
    <script src="src/grid.js"></script>
    <script src="src/pwa.js"></script>
  </body>
</html>
